name: Air

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: posit-dev/setup-air@482cb5912394878ab5a63b75db0f9d19cc6df5ba # v1.0.3
        with:
          version: "0.13.0"

      - name: Set up R for Markdown checks
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Check formatting
        run: air format . --check

      - name: Check R Markdown formatting
        shell: bash
        run: |
          air --version
          # Shared pkgdown formatter pinned to its reviewed skill revision.
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/jlmelville/codex-workflows/fed18a49d881a09851e9852aec1ef79a317d282b/skills/r-docs-pkgdown/scripts/format-rmd.py \
            --output "${RUNNER_TEMP}/format-rmd.py"
          printf '%s  %s\n' \
            '3fee3412a5d81d7d391bdce9228148e856f3532ee6b227e07396d8501ffe4fe1' \
            "${RUNNER_TEMP}/format-rmd.py" | shasum -a 256 --check --quiet
          mapfile -d '' -t rmd_files < <(git ls-files -z -- '*.[Rr][Mm][Dd]')
          python3 "${RUNNER_TEMP}/format-rmd.py" --check "${rmd_files[@]}"
